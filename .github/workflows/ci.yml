name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: dsh-compaction-cache-aware
        run: npm install --no-audit --no-fund
      - name: Run tests
        working-directory: dsh-compaction-cache-aware
        run: node --test
